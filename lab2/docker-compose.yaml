services:
  postgres-service:
    image: postgres:16-alpine
    env_file: .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5

  migrate-service:
    build: ./backend
    command: >
      sh -c "python manage.py migrate &&
             python manage.py collectstatic --noinput"
    env_file: .env
    volumes:
      - static_files:/staticfiles
    depends_on:
      postgres-service:
        condition: service_healthy

  backend-service:
    build: ./backend
    command: gunicorn lab1.wsgi:application --bind 0.0.0.0:8000
    env_file: .env
    volumes:
      - static_files:/staticfiles
    depends_on:
      migrate-service:
        condition: service_completed_successfully

  nginx-service:
    build: ./nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - static_files:/static:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - backend-service

volumes:
  postgres_data:
  static_files: